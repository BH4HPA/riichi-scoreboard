services:
  riichi:
    image: "${RIICHI_IMAGE:-riichi-scoreboard}:${RIICHI_TAG:-local}"
    build:
      context: .
      dockerfile: apps/server/Dockerfile
      # 前端构建期配置：静态桶地址（曲库/识别模型）与页脚署名、备案号；留空即不显示对应内容
      args:
        VITE_STATIC_BASE_URL: "${VITE_STATIC_BASE_URL:-}"
        VITE_SITE_URL: "${VITE_SITE_URL:-}"
        VITE_SITE_AUTHOR: "${VITE_SITE_AUTHOR:-}"
        VITE_SITE_AUTHOR_URL: "${VITE_SITE_AUTHOR_URL:-}"
        VITE_SITE_SINCE: "${VITE_SITE_SINCE:-}"
        VITE_ICP_NUMBER: "${VITE_ICP_NUMBER:-}"
    ports:
      - "${RIICHI_PORT:-8787}:8787"
    environment:
      # 前端与后端同源部署时留空；前端另行托管到 COS 时填其 origin，逗号分隔
      CORS_ORIGINS: "${CORS_ORIGINS:-}"
      # 头像等对象存储：全空 = 本地磁盘（/data/objects）；变量含义见 .env.template
      QCLOUD_SECRET_ID: "${QCLOUD_SECRET_ID:-}"
      QCLOUD_SECRET_KEY: "${QCLOUD_SECRET_KEY:-}"
      QCLOUD_COS_BUCKET: "${QCLOUD_COS_BUCKET:-}"
      QCLOUD_COS_REGION: "${QCLOUD_COS_REGION:-}"
      QCLOUD_COS_ENDPOINT: "${QCLOUD_COS_ENDPOINT:-}"
      QCLOUD_COS_CDN_DOMAIN: "${QCLOUD_COS_CDN_DOMAIN:-}"
      COS_KEY_PREFIX: "${COS_KEY_PREFIX:-riichi/}"
      # 前端另行托管时设为空串：镜像不再提供页面，页面路径 302 到 CORS_ORIGINS 第一项
      WEB_DIST: "${WEB_DIST-/app/web}"
    volumes:
      - riichi_data:/data
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "-Y", "off", "http://127.0.0.1:8787/health"]
      interval: 15s
      timeout: 3s
      retries: 5
volumes:
  riichi_data:
