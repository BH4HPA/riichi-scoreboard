[project]
name = "riichi-ml"
version = "0.1.0"
description = "牌面检测模型（YOLO11n）的训练、导出与预标注脚本"
requires-python = ">=3.11,<3.14"
dependencies = [
  "ultralytics>=8.3.67",
  # export.sh 的 format=onnx simplify=True 在缺包时会让 ultralytics 自行 pip install，在 uv 环境里会失败：显式声明
  "onnx>=1.16",
  "onnxslim>=0.1.34",
  "onnxruntime>=1.18",
  "numpy>=1.26",
  "roboflow>=1.1",
  "pillow>=10",
  "pyyaml>=6",
]

[tool.uv]
package = false
